{% if view.has_more %}
<p class="more" id="more">
  <a id="more-link" class="link-button" href="/?{{ query }}&amp;show={{ next_show }}" data-page-size="{{ step }}"
     hx-get="/?{{ query }}" hx-target="#cards" hx-select="#cards" hx-swap="outerHTML" hx-push-url="true" hx-indicator="#results">Show more</a>
</p>
{% endif %}
