<!doctype html>
<html lang="en" data-theme="{{ theme }}" data-appearance="{{ appearance }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false,"allowScriptTags":false}'>
  <title>{% block title %}uppYT{% endblock %}</title>
  <link rel="stylesheet" href="{{ assets.css }}">
  <link rel="preload" href="/static/fonts/ibm-plex-sans-400.woff2" as="font" type="font/woff2" crossorigin>
  <script src="{{ assets.htmx }}" defer></script>
  <script src="{{ assets.js }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {% set current = request.url.path %}
  <header class="topbar">
    <a class="topbar__logo" href="/">uppYT</a>
    {% if profile %}
    <nav class="topbar__nav" aria-label="Main">
      <a href="/" {% if current == "/" %}aria-current="page"{% endif %}>Board</a>
      <a href="/channels" {% if current.startswith("/channels") %}aria-current="page"{% endif %}>Channels</a>
      <a href="/seen" {% if current == "/seen" %}aria-current="page"{% endif %}>Seen</a>
      <a href="/settings" {% if current == "/settings" %}aria-current="page"{% endif %}>Settings</a>
    </nav>
    <span class="topbar__who"><a href="/profiles" aria-label="Profile: {{ profile_name }}. Switch profile">{{ profile_name }}</a></span>
    {% endif %}
  </header>
  <main id="main">{% block main %}{% endblock %}</main>
  <div class="toasts" id="toasts" role="status" aria-live="polite" data-fade-after="8000"></div>
</body>
</html>
