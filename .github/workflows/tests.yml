name: Tests
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run playwright install --with-deps chromium
      # Pixel baselines are local to each machine, so here they're only created. Every other check runs in full.
      - run: uv run pytest -m ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contact-sheet
          path: .ui-report
