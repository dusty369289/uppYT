name: Tests
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run playwright install --with-deps chromium
      # Pixel baselines belong to one machine, and this one is thrown away, so there's never anything to compare.
      - run: uv run pytest -m ui --ui-no-baselines
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contact-sheet
          path: .ui-report
          include-hidden-files: true # the folder starts with a dot, which is otherwise skipped without failing
          if-no-files-found: error
