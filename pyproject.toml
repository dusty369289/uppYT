[project]
name = "uppyt"
version = "0.1.0"
description = "A board of recent uploads from the YouTube channels you follow, ranked by your priorities."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = [
    "defusedxml>=0.7",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pydantic>=2.9",
    "python-multipart>=0.0.9",
    "sqlmodel>=0.0.22",
    "textual>=0.80",
    "tomlkit>=0.13",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.scripts]
uppyt = "uppyt.cli.main:app"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pillow>=11",
    "playwright>=1.50",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.6",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uppyt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 10 # a hung test fails with a stack trace. A hang is a bug, not a limit to raise.
addopts = "-n auto -m 'not ui and not live'"
asyncio_mode = "auto"
tmp_path_retention_policy = "failed"
markers = [
    "ui: browser checks across the page matrix. Run with: pytest -m ui -n 0",
    "live: talks to the real YouTube, to notice format changes. Run with: pytest -m live",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
